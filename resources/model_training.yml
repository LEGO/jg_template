# Training job for MLOps pipeline.

resources:
  jobs:
    model_training_job:
      name: model_training_job

      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: Europe/Copenhagen
        pause_status: ${var.pause_status}

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      tasks:        
        - task_key: train_model
          python_wheel_task:
            package_name: mlops_pipeline
            entry_point: model_training_job
            named_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_name: ${var.model_name}
              feature_store_table_name: ${var.feature_store_table_name}
              experiment_path: ${var.experiment_path}_model_training
              hyperparameter_experiment_path: ${var.experiment_path}_hyperparameter_tuning
          job_cluster_key: job_cluster
          libraries:
            - whl: ../dist/*.whl
        
        - task_key: serve_model
          python_wheel_task:
            package_name: mlops_pipeline
            entry_point: model_serving_job
            named_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_name: ${var.model_name}
              serving_endpoint_name: ${var.model_name}_endpoint
              permission_group: ${var.permission_group}
              workload_size: Small
              scale_to_zero: "true"
          job_cluster_key: job_cluster
          libraries:
            - whl: ../dist/*.whl
          depends_on:
            - task_key: train_model
       
        - task_key: batch_prediction_task
          python_wheel_task:
            package_name: mlops_pipeline
            entry_point: batch_prediction
            named_parameters:
              catalog_name: ${var.catalog}
              schema_name: ${var.schema}
              model_name: ${var.model_name}
              feature_store_table_name: ${var.feature_store_table_name}
              batch_prediction_table: ${var.batch_prediction_table}
              experiment_path: ${var.experiment_path}_batch_prediction
          job_cluster_key: job_cluster
          libraries:
            - whl: ../dist/*.whl
          depends_on:
            - task_key: train_model

      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            spark_version: 17.3.x-cpu-ml-scala2.13
            node_type_id: i3.2xlarge
            policy_id: ${var.policy_id}
            data_security_mode: SINGLE_USER
            aws_attributes:
              first_on_demand: 1
              zone_id: "auto"
            autoscale:
              min_workers: 1
              max_workers: 1
            custom_tags:
              SOURCE: "table"

      permissions:
        - group_name: c1.app.access.sscdp.ai_agency.developer
          level: CAN_MANAGE_RUN