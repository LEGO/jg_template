name: Databricks Test (Reusable)

on:
  workflow_call:
    inputs:
      python_version:
        description: "Python version to use for tests"
        required: false
        type: string
        default: "3.12"
      test_dirs:
        description: "Test directories to run"
        required: false
        type: string
        default: "tests/"
      dependency_group:
        description: "uv extra dependency group to install"
        required: false
        type: string
        default: "test"
      pytest_args:
        description: "Additional pytest arguments"
        required: false
        type: string
        default: "-v --tb=short"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ inputs.python_version }}

      - name: Install dependencies
        run: uv sync --extra ${{ inputs.dependency_group }}

      - name: Run tests
        run: uv run pytest ${{ inputs.test_dirs }} ${{ inputs.pytest_args }}
  