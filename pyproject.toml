[project]
name = "mlops_pipeline"
version = "0.0.1"
authors = [
    { name = "andreas.moelgaard-andersen@LEGO.com" },
    { name = "nikolaj.madsen@LEGO.com" }
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "omegaconf>=2.3.0",
]

[dependency-groups]


[project.optional-dependencies]
dev = [
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "mlflow>=3.8.1",
    "scikit-learn>=1.7.2",
    "ray[tune]>=2.40.0",
]
test = [
    "pytest>=9.0.3",
]

[project.scripts]
data_processing_job = "mlops_pipeline.data_preprocessing:main"
model_training_job = "mlops_pipeline.model.train_model:main"
model_tuning_job = "mlops_pipeline.model.tune_model:main"
model_tuning_ray_job = "mlops_pipeline.model.tune_model_ray:main"
model_serving_job = "mlops_pipeline.model.serve:main"
batch_prediction = "mlops_pipeline.batch_prediction:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_pipeline", "src/common"]
include = ["src/mlops_pipeline/model/model_config.yml"]

[tool.black]
line-length = 125
